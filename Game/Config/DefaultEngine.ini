[/Script/Engine.Engine]
; Time is physics frames: a fixed 60 Hz tick makes Chaos repeat and stops the background-editor throttle (tools/mcp/PHYSICS.md).
bUseFixedFrameRate=True
FixedFrameRate=60.000000

[/Script/Engine.RendererSettings]
r.AllowStaticLighting=False
; Lumen GI + reflections, virtual shadow maps; software Lumen needs mesh distance fields (tools/skills/look-painted-cel.md section 0).
r.GenerateMeshDistanceFields=True
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1
; Lane A65 (docs/experiments/PERF-FIXES.md, PROFILING.md offender 2): a 1024-page physical pool (128 MB) instead of the 512 MB default; the 90 m rink
; with 4-6 shadowed spots never fills it, and the 512 MB commit on the first shadowed frame cost 26-30 ms.
r.Shadow.Virtual.MaxPhysicalPages=1024
; Lane A65 (offender 6): TSR keeps a 1080p history instead of 200 %: TSR GPU time and ~90 MB of history textures.
r.TSR.History.ScreenPercentage=100
; Custom depth with stencil: the toon ramp and outline post passes read CustomStencil.
r.CustomDepth=3
; Fixed exposure is set per rig in its post-process volume.
r.DefaultFeature.AutoExposure=False

