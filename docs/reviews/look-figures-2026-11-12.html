<title>Look and Figures Review</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Figures from the Blender pipeline and the measured P2 night-look recommendations, with stills; pass, reject or comment on each.">

<header class="bar">
  <div class="bar-in side">
    <div class="row"><h1>Look and Figures Review</h1><div class="counts" id="counts" aria-live="polite"></div></div>
    <div class="row tools">
      <select id="grp" aria-label="Group filter"></select>
      <select id="st" aria-label="Status filter"><option value="">All items</option><option value="open">Undecided</option><option value="pass">Passed</option><option value="reject">Rejected</option><option value="comment">With a comment</option></select>
      <input id="q" type="search" placeholder="Search" aria-label="Search items">
      <button id="lg" type="button">Listen group</button>
    </div>
    <p class="bar-msg" id="voicemsg" hidden></p>
  </div>
</header>
<div class="side">
<main>
  
  <p class="keys"><kbd>J</kbd> next <kbd>K</kbd> previous <kbd>P</kbd> pass <kbd>R</kbd> reject <kbd>L</kbd> listen <kbd>C</kbd> comment <kbd>Esc</kbd> leave the comment. P and R move to the next item; press the same key again on an item to clear it. Decisions are saved in this browser.</p>
  <div id="list"></div>
</main>
<footer class="exp">
  <h2>Send the decisions back</h2>
  <div class="row">
    <button id="xj" type="button" class="prime">Copy JSON</button>
    <button id="xm" type="button">Copy markdown summary</button>
    <button id="xc" type="button">Clear all decisions</button>
  </div>
  <p class="status" id="xs" role="status"></p>
  <textarea id="out" readonly aria-label="Exported decisions" placeholder="The export appears here. Paste it back to the chat."></textarea>
</footer>

<script type="application/json" id="data">{"title":"Look and Figures Review","listen":false,"listenNote":false,"items":[{"id":"fig.toy","group":"Figures (Blender, lane A22)","subgroup":"toy, 1.6 m, 3,808 triangles","text":"Toy skater: two mitten hands on a tapered stick with a blade, helmet dome with band and visor, number patch, skate plate with two runners. Top row of the sheet.","note":"Imported headless as SK_SkaterToy with 17 animations (idle, skate, carry, aim, poke, lift, shoot, check, knocked down, faceoff, draw, goalie stances). Not yet on the ice: a swap for the code-built figure is your call.","image":"img/figures-sheet.png"},{"id":"fig.clay","group":"Figures (Blender, lane A22)","subgroup":"clay, 22,692 triangles","text":"Clay variant: thumb dents on the torso, felt seam with stitch bars, same rig and animations. Middle row.","note":"For the P3 tier on device B's clay rig; exported, not imported."},{"id":"fig.broadcast","group":"Figures (Blender, lane A22)","subgroup":"broadcast, 1.85 m, 4,360 triangles","text":"Broadcast variant: neck, elbows, gloves with cuffs, knees, shins, helmet with cage line, no face. Bottom row.","note":"For P4 only if P3 ships; exported, not imported."},{"id":"fig.props","group":"Figures (Blender, lane A22)","subgroup":"props, one 1K atlas","text":"Props set: net with tubular frame and netting, board segment with kick plate and glass, bench, puck, goal light, two pickup pedestals.","note":"Low poly, 20 to 25 KB each; device B owns Props and Arena, so these go to B as a handoff if you pass them.","image":"img/props.png"},{"id":"look.sheet-play","group":"P2 night look (lab, lane A23)","subgroup":"play, 10 / 24 / 40 m, left = today, right = recommended","text":"The recommended combination against device B's current look on the same frozen frame during play.","note":"Whole-frame cost on the 4090: 6.5 ms today, 7.0 ms recommended. The film props in the stills are already ruled out (R-0021) and B is removing them.","image":"img/look-play.jpg"},{"id":"look.sheet-faceoff","group":"P2 night look (lab, lane A23)","subgroup":"faceoff, 10 / 24 / 40 m, left = today, right = recommended","text":"The same comparison at the faceoff.","image":"img/look-faceoff.jpg"},{"id":"look.1","group":"P2 night look (lab, lane A23)","subgroup":"recommendation 1","text":"Deep-blue gradient sky dome instead of the black room walls and ceiling.","note":"Largest single effect: the void goes, the dark ice lightens, dressing gets a horizon. +0.0 ms."},{"id":"look.2","group":"P2 night look (lab, lane A23)","subgroup":"recommendation 2","text":"Spot inner cone 5 degrees (outer 26.5): soft pools with wide painted rings instead of hard discs."},{"id":"look.3","group":"P2 night look (lab, lane A23)","subgroup":"recommendation 3","text":"Ice with two posterised tiles (scuff streaks along the rink, frost patches) and a slightly wet surface for the spot reflections.","note":"+0.5 ms, the only measurable cost in the set."},{"id":"look.4","group":"P2 night look (lab, lane A23)","subgroup":"recommendation 4","text":"Outline width by distance: 3 px at 10 m down to 1.5 px at 40 m, constant ink colour, inner lines from normals."},{"id":"look.5","group":"P2 night look (lab, lane A23)","subgroup":"recommendation 5","text":"Figure fill 2.5 down to 1.5 so the toon bands read on the figures at all.","note":"Twelve ramp variants were identical at 24 m with the current fill. The figures remain the weakest link; see the Blender group."},{"id":"look.6","group":"P2 night look (lab, lane A23)","subgroup":"recommendation 6","text":"Construction: ochre kick plate band, dark glass rail with stanchions, 14 cm red net frame.","note":"Reads at 10 to 24 m; the far net at 40 m becomes a bolder box with the outline."},{"id":"look.7","group":"P2 night look (lab, lane A23)","subgroup":"recommendation 7","text":"Two faint haze cards at the rink ends only; no light shafts, no side haze.","note":"Shaft cones washed the frame whenever the chase camera sat inside a pool."},{"id":"look.rt","group":"P2 night look (lab, lane A23)","subgroup":"rejected with evidence","text":"Hardware ray tracing (Lumen HWRT, ray-traced ice reflections) adds 0.5 to 0.7 ms and changes nothing visible at any distance; planar reflections cost 4.7 ms; forced screen-space reflections +1.7 ms with no gain.","note":"Marked reject by the lab. Pass here only if you want them kept as options anyway."}]}</script>
<script>
(function () {
  'use strict';
  var CFG = JSON.parse(document.getElementById('data').textContent);

  var KEY = 'review:' + TITLE;
  var dec = {};
  try { var raw = localStorage.getItem(KEY); if (raw) dec = JSON.parse(raw) || {}; } catch (e) { dec = {}; }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(dec)); } catch (e) {} }
  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }

  // ---- build the DOM -------------------------------------------------------

  var openAll = ITEMS.length <= 60;
  var sel = $('grp'); sel.appendChild(new Option('All groups', ''));
  groups.forEach(function (g, gi) {
    sel.appendChild(new Option(g.name + ' (' + g.items.length + ')', String(gi)));
    var d = el('details', 'group'); d.open = openAll || gi === 0; g.node = d;
    var s = el('summary'); s.appendChild(el('span', 'g-name', g.name));
    g.countEl = el('span', 'g-count'); s.appendChild(g.countEl);
    var act = el('span', 'g-actions');
    var bl = el('button', 'glisten', 'Listen'); bl.type = 'button';

    act.appendChild(bl); act.appendChild(bp); s.appendChild(act); d.appendChild(s);
    bp.addEventListener('click', function (e) {
      e.preventDefault(); e.stopPropagation();

    bl.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); toggleGroupListen(g); });
    var lastSub = null;

      var c = el('div', 'ctl');

      var seg = el('div', 'seg'); seg.setAttribute('role', 'radiogroup'); seg.setAttribute('aria-label', 'Verdict for ' + it.id);

        var l = el('label', o[2]); var r = document.createElement('input');
        r.type = 'radio'; r.name = 'v' + it._i; r.value = o[0]; r.id = 'r-' + o[0] + '-' + it._i;

  }

  // ---- counts and filters --------------------------------------------------
  function counts() {
    var p = 0, r = 0, c = 0;
    ITEMS.forEach(function (it) { var d = get(it.id); if (d.v === 'pass') p++; if (d.v === 'reject') r++; if (d.c) c++; });
    return { total: ITEMS.length, reviewed: p + r, pass: p, reject: r, comment: c };
  }
  function refresh() {
    var c = counts();
    var box = $('counts'); box.textContent = '';
    [['', 'reviewed ' + c.reviewed + '/' + c.total], ['p', 'passed ' + c.pass], ['r', 'rejected ' + c.reject], ['c', 'commented ' + c.comment]].forEach(function (x) {
      box.appendChild(el('span', 'cnt ' + x[0], x[1]));
    });
    var gv = sel.value, st = $('st').value, q = $('q').value.trim().toLowerCase(), shown = 0;
    groups.forEach(function (g) {
      var n = 0, dn = 0;
      g.items.forEach(function (it) {
        var d = get(it.id), ok = (gv === '' || gv === String(g.idx));

  $('q').addEventListener('input', refresh);

  // ---- verdicts and keyboard -----------------------------------------------
  var active = -1;
  function visible() { return ITEMS.filter(function (it) { return !nodes[it.id].hidden && !nodes[it.id].parentNode.hidden; }); }
  function activate(i, scroll) {
    if (active >= 0 && ITEMS[active]) nodes[ITEMS[active].id].classList.remove('active');
    active = i; if (i < 0) return;
    var n = nodes[ITEMS[i].id]; n.classList.add('active');
    var det = n.closest('details'); if (det && !det.open) det.open = true;

      if (r.top < bar + 8 || r.bottom > window.innerHeight - 8) window.scrollTo({ top: window.scrollY + r.top - bar - 24 });
    }

    var it = ITEMS[i], cur = get(it.id).v;

  list.addEventListener('click', function (e) {
    var n = e.target.closest('.item'); if (n) activate(+n.dataset.i, false);
    var r = e.target.closest('input[type=radio]');

      setDec(ITEMS[i].id, { v: saved === r.value ? '' : r.value }); paint(ITEMS[i]); refresh();

  list.addEventListener('input', function (e) {
    if (!e.target.classList.contains('cmt')) return;

    var pos = vis.findIndex(function (it) { return it._i === active; });
    if (k === 'j') activate(vis[Math.min(vis.length - 1, pos + 1)]._i, true);
    else if (k === 'k') activate(vis[Math.max(0, pos < 0 ? 0 : pos - 1)]._i, true);
    else if (k === 'p' || k === 'r') {
      if (pos < 0) { activate(vis[0]._i, true); pos = 0; }
      verdict(active, k === 'p' ? 'pass' : 'reject');
      if (get(ITEMS[active].id).v && pos < vis.length - 1) activate(vis[pos + 1]._i, true);
    }
    else if (k === 'l') { if (LISTEN) { if (pos < 0) activate(vis[0]._i, true); toggleListen(active); } }
    else if (k === 'c') { if (pos < 0) activate(vis[0]._i, true); $('c-' + active).focus(); }
    e.preventDefault();
  });

  // ---- listen --------------------------------------------------------------
  var synth = window.speechSynthesis, can = !!synth && typeof SpeechSynthesisUtterance !== 'undefined';
  var voice = null, speakingIdx = -1, queue = null, token = 0;
  function pickVoice() {
    var vs = can ? synth.getVoices() : [];
    voice = vs.find(function (v) { return v.lang && v.lang.replace('_', '-') === 'en-US'; }) || vs.find(function (v) { return v.lang && v.lang.replace('_', '-') === 'en-GB'; }) ||
      vs.find(function (v) { return v.lang && /^en/i.test(v.lang); }) || null;
    var msg = $('voicemsg');
    if (!LISTEN) { msg.hidden = true; return; }
    if (!can) {
      msg.hidden = false; msg.textContent = 'This browser cannot read aloud, so the Listen buttons are off. Read the lines instead.';
      document.querySelectorAll('button.listen, button.glisten, #lg').forEach(function (b) { b.disabled = true; b.title = 'No speech synthesis in this browser'; });
    } else if (vs.length && !voice) {
      msg.hidden = false; msg.textContent = 'No English voice on this device. Listen uses the default voice, which may mispronounce.';
    } else if (!vs.length && late) {
      msg.hidden = false; msg.textContent = 'This device reports no speech voice. If Listen stays silent, read the lines instead.';
    } else msg.hidden = true;
  }
  var late = false; setTimeout(function () { late = true; pickVoice(); }, 1500);
  if (!LISTEN) $('lg').hidden = true;
  if (can && synth.addEventListener) synth.addEventListener('voiceschanged', pickVoice);
  pickVoice();
  function clearPlaying() { document.querySelectorAll('.item.playing').forEach(function (n) { n.classList.remove('playing'); }); }
  function stopAll() {
    token++; queue = null; speakingIdx = -1; clearPlaying();
    if (can) { try { synth.cancel(); } catch (e) {} }
    document.querySelectorAll('button.glisten').forEach(function (b) { b.textContent = 'Listen'; }); $('lg').textContent = 'Listen group';
  }
  function say(i, done) {
    var it = ITEMS[i], my = ++token; speakingIdx = i; clearPlaying(); nodes[it.id].classList.add('playing');
    var u = new SpeechSynthesisUtterance(it.text + (LISTEN_NOTE && it.note ? '. ' + it.note : ''));
    if (voice) { u.voice = voice; u.lang = voice.lang; } else u.lang = 'en-US';
    u.rate = 1.0;
    var fin = function () { if (my !== token) return; speakingIdx = -1; clearPlaying(); if (done) done(); };
    u.onend = fin; u.onerror = function () { if (my !== token) return; if (queue) stopAll(); else fin(); };
    try { synth.cancel(); synth.speak(u); } catch (e) { fin(); }
  }
  function toggleListen(i) {
    if (!can) return;
    if (speakingIdx === i && !queue) { stopAll(); return; }
    stopAll(); activate(i, true); say(i);
  }
  function toggleGroupListen(g) {
    if (!can) return;
    if (queue === g) { stopAll(); return; }
    stopAll(); queue = g; g.node.open = true;
    var seq = g.items.filter(function (it) { return !nodes[it.id].hidden; }), k = 0;
    var btn = g.node.querySelector('.glisten'); if (btn) btn.textContent = 'Stop';
    $('lg').textContent = 'Stop';
    (function next() {
      if (queue !== g) return;
      if (k >= seq.length) { stopAll(); return; }
      var it = seq[k++]; activate(it._i, true); say(it._i, next);
    })();
  }
  $('lg').addEventListener('click', function () {
    if (queue) { stopAll(); return; }
    var gv = sel.value, g = gv !== '' ? groups[+gv] : (active >= 0 ? gIndex[ITEMS[active].group] : groups[0]);
    if (g) toggleGroupListen(g);
  });
  window.addEventListener('pagehide', stopAll);

  // ---- export --------------------------------------------------------------
  function decisions() {
    var out = [];
    ITEMS.forEach(function (it) {
      var d = get(it.id); if (!d.v && !d.c) return;
      var o = { id: it.id }; if (d.v) o.verdict = d.v; if (d.c) o.comment = d.c; out.push(o);
    });
    return out;
  }
  function jsonText() { return JSON.stringify({ title: TITLE, decided_at: new Date().toISOString(), decisions: decisions() }, null, 2); }
  function mdText() {
    var c = counts(), ds = decisions(), byId = {}; ITEMS.forEach(function (it) { byId[it.id] = it; });
    var L = ['# ' + TITLE + ': decisions', '',
      'Reviewed ' + c.reviewed + ' of ' + c.total + ': ' + c.pass + ' passed, ' + c.reject + ' rejected, ' + c.comment + ' commented, ' + (c.total - c.reviewed) + ' undecided.', ''];
    var rej = ds.filter(function (d) { return d.verdict === 'reject'; });
    L.push('## Rejected (' + rej.length + ')');
    rej.forEach(function (d) { L.push('- `' + d.id + '` ' + byId[d.id].text); });
    if (!rej.length) L.push('- none');
    var cm = ds.filter(function (d) { return d.comment; });
    L.push('', '## Comments (' + cm.length + ')');
    cm.forEach(function (d) { L.push('- `' + d.id + '` (' + (d.verdict || 'no verdict') + ') ' + byId[d.id].text + ' -- ' + d.comment); });
    if (!cm.length) L.push('- none');
    return L.join('\n') + '\n';
  }
  function exportTo(text, what) {
    var out = $('out'), s = $('xs'); out.value = text;
    var done = function (ok) {
      s.textContent = ok ? what + ' copied to the clipboard. Paste it back to the chat.' : 'Copy was blocked here. The ' + what + ' is selected below; copy it with Ctrl+C.';
      if (!ok) { out.focus(); out.select(); }
    };
    try { navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); }); } catch (e) { done(false); }
  }
  $('xj').addEventListener('click', function () { exportTo(jsonText(), 'JSON'); });
  $('xm').addEventListener('click', function () { exportTo(mdText(), 'Markdown summary'); });
  var armed = 0;
  $('xc').addEventListener('click', function () {
    var b = $('xc');
    if (!armed) { armed = 1; b.textContent = 'Click again to clear'; setTimeout(function () { armed = 0; b.textContent = 'Clear all decisions'; }, 4000); return; }
    armed = 0; b.textContent = 'Clear all decisions'; dec = {}; save(); ITEMS.forEach(paint); refresh(); $('xs').textContent = 'All decisions cleared.';
  });
})();
</script>
